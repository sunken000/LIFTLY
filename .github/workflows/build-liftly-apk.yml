name: Build Liftly APK

on:
  push:
    branches:
      - agent/training-load-warmup-supersets
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Run focused tests
        run: ./gradlew testPersonalDebugUnitTest --tests com.liftly.app.domain.ExerciseIdentityResolverTest --tests com.liftly.app.domain.SupersetPlannerTest
      - name: Build APK
        run: ./gradlew assemblePersonalDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: liftly-training-improvements-apk
          path: app/build/outputs/apk/personal/debug/*.apk
          if-no-files-found: error
