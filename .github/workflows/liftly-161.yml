name: Validate Liftly 1.6.1

on:
  push:
    branches:
      - agent/liftly-161
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Liftly 1.6.1
        run: |
          chmod +x gradlew
          python3 tools/apply_liftly_161.py

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Compile phone app
        run: ./gradlew :app:assembleDebug

      - name: Compile Android UI tests
        run: ./gradlew :app:assembleDebugAndroidTest

      - name: Compile Wear OS companion
        run: ./gradlew :wear:assembleDebug

      - name: Compile Macrobenchmark module
        run: ./gradlew :macrobenchmark:assemble

      - name: Prepare APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Liftly-v1.6.1.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk Liftly-Wear-v1.6.1.apk
          test -s Liftly-v1.6.1.apk
          test -s Liftly-Wear-v1.6.1.apk

      - name: Remove migration-only files
        run: |
          rm -f tools/apply_liftly_161.py
          rm -f .github/workflows/liftly-161.yml

      - name: Publish validated 1.6.1 to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Entrega Liftly 1.6.1 [skip ci]"
            git push origin HEAD:agent/liftly-161
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: liftly-1.6.1-apks
          path: |
            Liftly-v1.6.1.apk
            Liftly-Wear-v1.6.1.apk
          if-no-files-found: error
