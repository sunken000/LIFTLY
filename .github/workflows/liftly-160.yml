name: Validate Liftly 1.6.0

on:
  push:
    branches:
      - agent/liftly-160
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Liftly 1.6.0
        run: |
          chmod +x gradlew
          python3 tools/apply_liftly_160.py
          sed -i 's/Liftly-v1\.5\.5\.apk/Liftly-v1.6.0.apk/g' README.md

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Compile phone app
        run: ./gradlew :app:assembleDebug

      - name: Compile Android UI tests
        run: ./gradlew :app:assembleDebugAndroidTest

      - name: Compile Wear OS companion
        run: ./gradlew :wear:assembleDebug

      - name: Compile Macrobenchmark module
        run: ./gradlew :macrobenchmark:assemble

      - name: Prepare APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Liftly-v1.6.0.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk Liftly-Wear-v1.6.0.apk
          test -s Liftly-v1.6.0.apk
          test -s Liftly-Wear-v1.6.0.apk

      - name: Remove migration-only files
        run: |
          rm -f tools/apply_liftly_160.py tools/trigger-160.txt
          rm -f .github/workflows/liftly-160.yml

      - name: Publish validated 1.6.0 to branch
        if: github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Entrega Liftly 1.6.0 [skip ci]"
            git push origin HEAD:agent/liftly-160
          fi

      - name: Upload phone and Wear APKs
        uses: actions/upload-artifact@v4
        with:
          name: liftly-1.6.0-apks
          path: |
            Liftly-v1.6.0.apk
            Liftly-Wear-v1.6.0.apk
          if-no-files-found: error
