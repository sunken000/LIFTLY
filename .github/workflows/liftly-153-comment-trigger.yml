name: Run Liftly 1.5.3 consolidation

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: liftly-153-consolidation
  cancel-in-progress: false

jobs:
  consolidate:
    if: github.event.comment.body == '/liftly-153'
    runs-on: ubuntu-latest
    steps:
      - name: Signal start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 2 --repo sunken000/LIFTLY --body 'Liftly 1.5.3: execução iniciada.'

      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Apply consolidation
        shell: bash
        run: |
          cp tools/liftly_153_cleanup.py /tmp/liftly_153_cleanup.py
          rm -f tools/liftly_153_cleanup.py
          rm -f .github/workflows/liftly-153-cleanup.yml
          rm -f .github/workflows/liftly-153-comment-trigger.yml
          python3 /tmp/liftly_153_cleanup.py

      - name: Build Liftly 1.5.3
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Liftly-v1.5.3.apk
          test -s Liftly-v1.5.3.apk
          sha256sum Liftly-v1.5.3.apk

      - name: Commit and publish
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Consolida Liftly 1.5.3"
          git push origin master

      - name: Signal success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 2 --repo sunken000/LIFTLY --body 'Liftly 1.5.3: consolidação concluída.'

      - name: Signal failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 2 --repo sunken000/LIFTLY --body 'Liftly 1.5.3: consolidação falhou; revisar execução.'
