name: Apply training patch and build APK

on:
  push:
    branches:
      - agent/training-load-warmup-supersets
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check staged patch
        id: staged
        shell: bash
        run: |
          if [ -f .agent/patch.00 ] && [ -f .agent/patch.07 ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Apply patch
        if: steps.staged.outputs.ready == 'true'
        shell: bash
        run: |
          cat .agent/patch.* > /tmp/training.patch
          git apply --check /tmp/training.patch
          git apply /tmp/training.patch
          rm -rf .agent
      - name: Run unit tests
        if: steps.staged.outputs.ready == 'true'
        run: ./gradlew testPersonalDebugUnitTest
      - name: Build personal debug APK
        if: steps.staged.outputs.ready == 'true'
        run: ./gradlew assemblePersonalDebug
      - name: Commit applied patch
        if: steps.staged.outputs.ready == 'true' && github.event_name == 'push'
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: improve load progression warmups and supersets"
          git push
      - name: Upload APK
        if: steps.staged.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: liftly-training-improvements-apk
          path: app/build/outputs/apk/personal/debug/*.apk
          if-no-files-found: error
