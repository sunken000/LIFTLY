name: Build Liftly APK

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply visual polish 1.5.4
        run: python3 tools/apply_visual_polish_154.py

      - name: Build debug APK
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest assembleDebug

      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Liftly-v1.5.4.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Liftly-v1.5.4
          path: Liftly-v1.5.4.apk
          if-no-files-found: error

      - name: Publish source and APK to master
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/build.gradle.kts \
                  app/src/main/java/com/liftly/app/ui/theme/Theme.kt \
                  app/src/main/java/com/liftly/app/ui/components/Components.kt \
                  app/src/main/java/com/liftly/app/ui/LiftlyApp.kt \
                  app/src/main/java/com/liftly/app/ui/screens/OnboardingScreen.kt \
                  README.md CHANGELOG.md docs/PATCH_NOTES_1.5.4.md Liftly-v1.5.4.apk
          if git diff --cached --quiet; then
            echo "Nenhuma mudança para publicar."
          else
            git commit -m "Refina visual do Liftly 1.5.4"
            git push origin HEAD:master
          fi
