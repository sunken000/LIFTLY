name: Validate Liftly 1.6.2

on:
  push:
    branches: [agent/liftly-162]
  pull_request:
    branches: [master]

permissions:
  contents: write

jobs:
  validate-build-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Apply Liftly 1.6.2
        run: |
          chmod +x gradlew
          python3 tools/apply_liftly_162.py

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Compile phone app
        run: ./gradlew :app:assembleDebug

      - name: Compile Android UI tests
        run: ./gradlew :app:assembleDebugAndroidTest

      - name: Compile Wear OS companion
        run: ./gradlew :wear:assembleDebug

      - name: Compile Macrobenchmark module
        run: ./gradlew :macrobenchmark:assemble

      - name: Prepare APKs
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Liftly-v1.6.2.apk
          cp wear/build/outputs/apk/debug/wear-debug.apk Liftly-Wear-v1.6.2.apk
          test -s Liftly-v1.6.2.apk
          test -s Liftly-Wear-v1.6.2.apk

      - name: Publish validated 1.6.2 to branch
        if: github.event_name == 'push'
        run: |
          rm -f tools/apply_liftly_162.py tools/trigger-162.txt
          rm -f .github/workflows/validate-liftly-162.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to publish"
          else
            git commit -m "Liftly 1.6.2 — bi-set direto na ficha [skip ci]"
            git push origin HEAD:agent/liftly-162
          fi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: liftly-1.6.2-apks
          path: |
            Liftly-v1.6.2.apk
            Liftly-Wear-v1.6.2.apk
          if-no-files-found: error
